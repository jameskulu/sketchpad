<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="#f0fdf4"/>

  <!-- Large Classroom Whiteboard / Easel Stand -->
  <g transform="translate(60, 25)">
    <!-- Wooden easel legs -->
    <path d="M40 185l-15 25M240 185l15 25M140 185v25" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

    <!-- Board outer frame -->
    <rect width="280" height="160" rx="12" fill="#ffffff" stroke="#0d253d" stroke-width="2.5"/>
    <rect x="8" y="8" width="264" height="144" rx="8" fill="#f8fafc"/>

    <!-- Grid lines on left half -->
    <defs>
      <pattern id="math-grid" width="12" height="12" patternUnits="userSpaceOnUse">
        <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#e2e8f0" stroke-width="1"/>
      </pattern>
    </defs>
    <rect x="16" y="16" width="105" height="128" rx="6" fill="url(#math-grid)" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Geometric Triangle on grid -->
    <path d="M30 120 L95 120 L30 45 Z" fill="#533afd" fill-opacity="0.12" stroke="#533afd" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Right angle square symbol -->
    <path d="M30 110 h10 v10" fill="none" stroke="#533afd" stroke-width="1.5"/>
    <!-- Angle arc on hypotenuse -->
    <path d="M80 120 A 15 15 0 0 0 88 108" fill="none" stroke="#ea2261" stroke-width="2"/>
    <text x="35" y="86" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0d253d">a</text>
    <text x="60" y="132" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0d253d">b</text>
    <text x="68" y="76" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#533afd">c</text>

    <!-- Formula block on right side -->
    <g transform="translate(138, 28)">
      <rect width="120" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="14" y="21" font-family="system-ui, monospace, sans-serif" font-size="13" font-weight="700" fill="#0d253d">a² + b² = c²</text>

      <!-- Science / Function Curve -->
      <g transform="translate(0, 44)">
        <rect width="120" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
        <!-- Coordinate axes -->
        <path d="M12 48h96M24 10v42" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Smooth sinusoidal wave -->
        <path d="M24 30 Q 42 12, 60 30 T 96 30" fill="none" stroke="#0e9f6e" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="60" cy="30" r="3" fill="#ea2261"/>
      </g>
    </g>

    <!-- Board bottom tray -->
    <rect x="-6" y="156" width="292" height="6" rx="3" fill="#0d253d"/>
    <!-- Eraser and markers on tray -->
    <rect x="25" y="151" width="30" height="5" rx="1.5" fill="#f59e0b"/>
    <rect x="65" y="152" width="18" height="4" rx="1" fill="#533afd"/>
    <rect x="88" y="152" width="18" height="4" rx="1" fill="#ea2261"/>
  </g>

  <!-- Drafting compass doodle -->
  <g transform="translate(25, 60) rotate(-12)">
    <path d="M18 6l-14 45M18 6l14 45" stroke="#0d253d" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="18" cy="6" r="4.5" fill="#533afd" stroke="#0d253d" stroke-width="1.5"/>
    <path d="M8 28h20" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Star / badge -->
  <g transform="translate(330, 45)">
    <circle cx="15" cy="15" r="16" fill="#0e9f6e" fill-opacity="0.15"/>
    <path d="M10 15l4 4 8-8" stroke="#0e9f6e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

