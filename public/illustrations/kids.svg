<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="#f0f9ff"/>

  <!-- Smiling Sun in top left -->
  <g transform="translate(45, 30)">
    <!-- Sun rays -->
    <path d="M40 8v-8M40 72v8M8 40H0M72 40h8M17 17l-6-6M63 63l6 6M17 63l-6 6M63 17l6-6" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <!-- Sun face -->
    <circle cx="40" cy="40" r="22" fill="#fde047" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="33" cy="36" r="2.5" fill="#0d253d"/>
    <circle cx="47" cy="36" r="2.5" fill="#0d253d"/>
    <circle cx="28" cy="42" r="3" fill="#fca5a5" fill-opacity="0.6"/>
    <circle cx="52" cy="42" r="3" fill="#fca5a5" fill-opacity="0.6"/>
    <path d="M34 44c2 3 10 3 12 0" stroke="#0d253d" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Big Cheerful Rainbow -->
  <g transform="translate(130, 40)">
    <!-- Arch 1: Red/Pink -->
    <path d="M10 120 A 70 70 0 0 1 150 120" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
    <!-- Arch 2: Yellow -->
    <path d="M18 120 A 62 62 0 0 1 142 120" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <!-- Arch 3: Green -->
    <path d="M26 120 A 54 54 0 0 1 134 120" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
    <!-- Arch 4: Blue/Indigo -->
    <path d="M34 120 A 46 46 0 0 1 126 120" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>

    <!-- Left Cloud -->
    <g transform="translate(-10, 105)">
      <circle cx="15" cy="15" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="28" cy="10" r="16" fill="#ffffff"/>
      <circle cx="40" cy="15" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="10" y="15" width="35" height="14" fill="#ffffff"/>
      <line x1="10" y1="29" x2="45" y2="29" stroke="#94a3b8" stroke-width="1.5"/>
    </g>

    <!-- Right Cloud -->
    <g transform="translate(115, 105)">
      <circle cx="15" cy="15" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="28" cy="10" r="16" fill="#ffffff"/>
      <circle cx="40" cy="15" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="10" y="15" width="35" height="14" fill="#ffffff"/>
      <line x1="10" y1="29" x2="45" y2="29" stroke="#94a3b8" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Cute Cat / Doodle Companion in Bottom Left -->
  <g transform="translate(45, 135)">
    <!-- Cat head with ears -->
    <path d="M15 45 Q 10 20 22 18 L 30 28 Q 45 20 60 28 L 68 18 Q 80 20 75 45 Q 82 75 45 75 Q 8 75 15 45 Z" fill="#ffffff" stroke="#0d253d" stroke-width="2.5"/>
    <!-- Eyes -->
    <circle cx="34" cy="44" r="3.5" fill="#0d253d"/>
    <circle cx="56" cy="44" r="3.5" fill="#0d253d"/>
    <circle cx="35" cy="43" r="1" fill="#ffffff"/>
    <circle cx="57" cy="43" r="1" fill="#ffffff"/>
    <!-- Nose & mouth -->
    <polygon points="45,49 42,46 48,46" fill="#f43f5e"/>
    <path d="M42 51 Q 45 54 48 51" stroke="#0d253d" stroke-width="1.5" fill="none"/>
    <!-- Whiskers -->
    <line x1="20" y1="46" x2="10" y2="44" stroke="#0d253d" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="50" x2="10" y2="52" stroke="#0d253d" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="70" y1="46" x2="80" y2="44" stroke="#0d253d" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="70" y1="50" x2="80" y2="52" stroke="#0d253d" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Colorful Crayons in Bottom Right -->
  <g transform="translate(290, 120)">
    <!-- Crayon 1: Pink -->
    <g transform="rotate(-25 20 40)">
      <rect x="0" y="10" width="18" height="55" rx="3" fill="#ec4899" stroke="#0d253d" stroke-width="2"/>
      <polygon points="0,10 9,0 18,10" fill="#ec4899" stroke="#0d253d" stroke-width="2"/>
      <rect x="0" y="24" width="18" height="24" fill="#0d253d" fill-opacity="0.2"/>
    </g>

    <!-- Crayon 2: Indigo -->
    <g transform="translate(32, 5) rotate(-10 20 40)">
      <rect x="0" y="10" width="18" height="55" rx="3" fill="#533afd" stroke="#0d253d" stroke-width="2"/>
      <polygon points="0,10 9,0 18,10" fill="#533afd" stroke="#0d253d" stroke-width="2"/>
      <rect x="0" y="24" width="18" height="24" fill="#0d253d" fill-opacity="0.2"/>
    </g>

    <!-- Crayon 3: Emerald -->
    <g transform="translate(62, 15) rotate(10 20 40)">
      <rect x="0" y="10" width="18" height="55" rx="3" fill="#10b981" stroke="#0d253d" stroke-width="2"/>
      <polygon points="0,10 9,0 18,10" fill="#10b981" stroke="#0d253d" stroke-width="2"/>
      <rect x="0" y="24" width="18" height="24" fill="#0d253d" fill-opacity="0.2"/>
    </g>
  </g>

  <!-- Fun stars floating around -->
  <path d="M320 40l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5z" fill="#f59e0b"/>
  <path d="M125 180l2 4 4 1-4 2-2 4-1-4-4-2 4-1 1-4z" fill="#ec4899"/>
  <path d="M260 25l2 4 4 2-4 1-2 4-2-4-4-1 4-2 2-4z" fill="#3b82f6"/>
</svg>

