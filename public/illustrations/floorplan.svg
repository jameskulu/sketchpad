<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="#fffbeb"/>

  <!-- Blueprint / Graph paper pattern -->
  <defs>
    <pattern id="floorplan-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#fde68a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#floorplan-grid)"/>

  <!-- Main Room Enclosure -->
  <g transform="translate(65, 30)">
    <!-- Outer thick walls -->
    <rect width="250" height="170" rx="4" fill="#ffffff" stroke="#0d253d" stroke-width="6"/>

    <!-- Doorway with 90-degree swing arc (Bottom left) -->
    <rect x="35" y="167" width="40" height="6" fill="#ffffff"/>
    <path d="M35 170 v-35" stroke="#0d253d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M35 135 A 35 35 0 0 1 70 170" fill="none" stroke="#533afd" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Window opening (Top right wall) -->
    <rect x="140" y="-3" width="65" height="6" fill="#ffffff"/>
    <line x1="140" y1="0" x2="205" y2="0" stroke="#0ea5e9" stroke-width="3"/>
    <line x1="140" y1="-2" x2="205" y2="-2" stroke="#0ea5e9" stroke-width="1"/>
    <line x1="140" y1="2" x2="205" y2="2" stroke="#0ea5e9" stroke-width="1"/>

    <!-- Modern Cozy Sofa (Top left) -->
    <g transform="translate(20, 20)">
      <rect width="90" height="42" rx="8" fill="#533afd" fill-opacity="0.15" stroke="#533afd" stroke-width="2"/>
      <rect x="6" y="6" width="78" height="12" rx="4" fill="#533afd" fill-opacity="0.3"/>
      <!-- Armrests -->
      <rect x="2" y="6" width="10" height="32" rx="3" fill="#533afd" fill-opacity="0.4"/>
      <rect x="78" y="6" width="10" height="32" rx="3" fill="#533afd" fill-opacity="0.4"/>
    </g>

    <!-- Coffee table -->
    <rect x="42" y="76" width="46" height="26" rx="6" fill="#f8fafc" stroke="#0d253d" stroke-width="2"/>

    <!-- Potted Monstera Plant (Top right corner) -->
    <g transform="translate(210, 25)">
      <circle cx="15" cy="15" r="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <!-- Green leaves spreading out -->
      <path d="M15 15c-6-12 2-15 4-8" stroke="#0e9f6e" stroke-width="3" stroke-linecap="round"/>
      <path d="M15 15c10-8 14-1 6 4" stroke="#0e9f6e" stroke-width="3" stroke-linecap="round"/>
      <path d="M15 15c-10 2-12 10-3 6" stroke="#0e9f6e" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Dining / Work Desk & Chairs (Bottom right) -->
    <g transform="translate(135, 95)">
      <rect width="80" height="48" rx="6" fill="#f8fafc" stroke="#0d253d" stroke-width="2"/>
      <!-- Two chairs -->
      <rect x="18" y="-10" width="22" height="7" rx="3.5" fill="#e2e8f0" stroke="#0d253d" stroke-width="1.5"/>
      <rect x="48" y="-10" width="22" height="7" rx="3.5" fill="#e2e8f0" stroke="#0d253d" stroke-width="1.5"/>
      <!-- Laptop on desk -->
      <rect x="35" y="16" width="24" height="16" rx="2" fill="#0d253d"/>
    </g>

    <!-- Dimension indicator: Width -->
    <g transform="translate(0, -14)">
      <line x1="0" y1="0" x2="250" y2="0" stroke="#0d253d" stroke-width="1.5"/>
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#0d253d" stroke-width="1.5"/>
      <line x1="250" y1="-5" x2="250" y2="5" stroke="#0d253d" stroke-width="1.5"/>
      <rect x="105" y="-9" width="42" height="18" rx="4" fill="#ffffff"/>
      <text x="110" y="4" font-family="system-ui, monospace, sans-serif" font-size="11" font-weight="700" fill="#0d253d">16' 0"</text>
    </g>

    <!-- Dimension indicator: Height -->
    <g transform="translate(262, 0)">
      <line x1="0" y1="0" x2="0" y2="170" stroke="#0d253d" stroke-width="1.5"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#0d253d" stroke-width="1.5"/>
      <line x1="-5" y1="170" x2="5" y2="170" stroke="#0d253d" stroke-width="1.5"/>
      <rect x="-9" y="75" width="42" height="18" rx="4" fill="#ffffff"/>
      <text x="-4" y="88" font-family="system-ui, monospace, sans-serif" font-size="11" font-weight="700" fill="#0d253d">12' 6"</text>
    </g>
  </g>

  <!-- North arrow in bottom left -->
  <g transform="translate(25, 175)">
    <circle cx="16" cy="16" r="14" fill="#ffffff" stroke="#0d253d" stroke-width="1.5"/>
    <path d="M16 6 L21 24 L16 20 L11 24 Z" fill="#ea2261"/>
    <text x="13" y="5" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#ea2261">N</text>
  </g>
</svg>

